name: Build APK & macOS

on:
  workflow_dispatch:
    inputs:
      version_prefix:
        description: 'Version prefix (e.g. 1.0, 1.1, 1.2, 2.0)'
        required: false
        default: '1.0'

jobs:
  build-apk:
    strategy:
      matrix:
        arch: [armv8]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          PREFIX="${{ github.event.inputs.version_prefix || '1.0' }}"
          RUN="${{ github.run_number }}"
          echo "VERSION=v${PREFIX}.${RUN}" >> $GITHUB_OUTPUT
          echo "NUM_VERSION=${PREFIX}.${RUN}" >> $GITHUB_OUTPUT

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Dlang
        uses: dlang-community/setup-dlang@v1

      - name: Build RABCDAsm from Source
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip git curl liblzma-dev
          git clone --depth 1 https://github.com/CyberShadow/RABCDAsm.git
          cd RABCDAsm
          dmd -run build_rabcdasm.d
          sudo cp abcexport rabcdasm rabcasm abcreplace /usr/local/bin/

      - name: Build & Patch Game.swf
        run: |
          chmod +x scripts/build-game.sh
          ./scripts/build-game.sh

      - name: Setup AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.1"
          accept-license: yes

      - name: Enable Picture-in-Picture in AIR SDK
        run: |
          python3 scripts/patch-air-pip.py

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > release.jks

      - name: Build APK (${{ matrix.arch }})
        run: |
          sed -i "s/APP_VERSION:String = \".*\"/APP_VERSION:String = \"${{ steps.version.outputs.VERSION }}\"/" loader/src/Config.as
          sed -i "s/<versionNumber>.*<\/versionNumber>/<versionNumber>${{ steps.version.outputs.NUM_VERSION }}<\/versionNumber>/" loader/app.xml
          sed -i "s/<versionLabel>.*<\/versionLabel>/<versionLabel>${{ steps.version.outputs.NUM_VERSION }}<\/versionLabel>/" loader/app.xml
          sed -i "s/<fullScreen>.*<\/fullScreen>/<fullScreen>true<\/fullScreen>/" loader/app.xml
          sed -i "s/<requestedDisplayResolution>.*<\/requestedDisplayResolution>/<requestedDisplayResolution>standard<\/requestedDisplayResolution>/" loader/app.xml
          
          amxmlc \
            -optimize=true \
            -inline=true \
            -omit-trace-statements=true \
            -library-path+=ane/BatteryOptimizer.swc \
            -output loader/Loader.swf \
            loader/src/Main.as
          
          adt -package -target apk-captive-runtime -arch ${{ matrix.arch }} \
            -storetype JKS \
            -keystore release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            YouMadBro-${{ matrix.arch }}.apk loader/app.xml \
            -extdir ane \
            -C loader Loader.swf icons gamefiles

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouMadBro-${{ matrix.arch }}
          path: YouMadBro-${{ matrix.arch }}.apk

      - name: Upload Game.swf Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Game-SWF
          path: loader/gamefiles/Game.swf

  build-mac:
    needs: build-apk
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          PREFIX="${{ github.event.inputs.version_prefix || '1.0' }}"
          RUN="${{ github.run_number }}"
          echo "VERSION=v${PREFIX}.${RUN}" >> $GITHUB_OUTPUT
          echo "NUM_VERSION=${PREFIX}.${RUN}" >> $GITHUB_OUTPUT

      - name: Download Patched Game.swf
        uses: actions/download-artifact@v4
        with:
          name: Patched-Game-SWF
          path: loader/gamefiles

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.1"
          accept-license: yes

      - name: Build macOS Application (.app)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NUM_VERSION="${{ steps.version.outputs.NUM_VERSION }}"

          sed -i '' "s/APP_VERSION:String = \".*\"/APP_VERSION:String = \"$VERSION\"/" loader/src/Config.as
          sed -i '' "s/<versionNumber>.*<\/versionNumber>/<versionNumber>$NUM_VERSION<\/versionNumber>/" loader/app.xml
          sed -i '' "s/<versionLabel>.*<\/versionLabel>/<versionLabel>$NUM_VERSION<\/versionLabel>/" loader/app.xml
          sed -i '' "s/<width>.*<\/width>/<width>960<\/width>/" loader/app.xml
          sed -i '' "s/<height>.*<\/height>/<height>550<\/height>/" loader/app.xml
          sed -i '' "s/<fullScreen>.*<\/fullScreen>/<fullScreen>false<\/fullScreen>/" loader/app.xml

          if grep -q "requestedDisplayResolution" loader/app.xml; then
            sed -i '' "s/<requestedDisplayResolution>.*<\/requestedDisplayResolution>/<requestedDisplayResolution>high<\/requestedDisplayResolution>/" loader/app.xml
          fi

          if [ -f "loader/src/Main.as" ]; then
            sed -i '' "s/width=\"[0-9]*\"/width=\"960\"/" loader/src/Main.as
            sed -i '' "s/height=\"[0-9]*\"/height=\"550\"/" loader/src/Main.as
          fi

          amxmlc \
            -optimize=true \
            -inline=true \
            -omit-trace-statements=true \
            -library-path+=ane/BatteryOptimizer.swc \
            -output loader/Loader.swf \
            loader/src/Main.as

          adt -certificate -cn SelfSigned 2048-RSA mac_cert.p12 123456

          APP_XML_MAC="loader/app_mac_temp.xml"
          sed '/<extensions>/,/<\/extensions>/d' loader/app.xml > "$APP_XML_MAC"

          adt -package \
            -storetype pkcs12 \
            -keystore mac_cert.p12 \
            -storepass 123456 \
            temp_package.air \
            "$APP_XML_MAC" \
            -C loader Loader.swf icons gamefiles

          ARCH_TYPE="armv8"
          if [[ $(uname -m) == "x86_64" ]]; then
            ARCH_TYPE="x64"
          fi

          mkdir -p dist
          rm -rf dist/YouMadBro_Mac.app

          adt -package \
            -target bundle \
            -arch $ARCH_TYPE \
            "dist/YouMadBro_Mac.app" \
            temp_package.air

          PLIST="dist/YouMadBro_Mac.app/Contents/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSDocumentsFolderUsageDescription string 'YouMadBro requires access to your Documents folder to load and save bot scripts and accounts.'" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSDownloadsFolderUsageDescription string 'YouMadBro requires access to your Downloads folder to load bot scripts.'" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSDesktopFolderUsageDescription string 'YouMadBro requires access to your Desktop folder to load bot scripts.'" "$PLIST" 2>/dev/null || true
          fi

          xattr -cr "dist/YouMadBro_Mac.app"
          codesign --force --deep --sign - "dist/YouMadBro_Mac.app"

          ditto -c -k --keepParent "dist/YouMadBro_Mac.app" "YouMadBro-macOS.zip"

          if [[ "$ARCH_TYPE" == "armv8" ]]; then
            if adt -package -target bundle -arch x64 "dist/YouMadBro_Mac-x64.app" temp_package.air 2>/dev/null; then
              xattr -cr "dist/YouMadBro_Mac-x64.app" || true
              codesign --force --deep --sign - "dist/YouMadBro_Mac-x64.app" || true
              ditto -c -k --keepParent "dist/YouMadBro_Mac-x64.app" "YouMadBro-macOS-x64.zip" || true
            fi
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouMadBro-macOS
          path: YouMadBro-macOS*.zip

  release:
    needs: [build-apk, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Set version
        id: version
        run: echo "VERSION=v${{ github.event.inputs.version_prefix || '1.0' }}.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            YouMadBro-armv8/YouMadBro-armv8.apk
            YouMadBro-macOS/*.zip
            Patched-Game-SWF/Game.swf